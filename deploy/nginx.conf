# ============================================
# 青萍小台 MVP - Nginx 配置
# ============================================
# 监听端口: 8080
# 反向代理后端: 127.0.0.1:8081
# 静态文件服务: frontend/dist
# ============================================

server {
    # 监听端口（不能使用 8501/8000/3306/443/22/80）
    listen 8080;
    listen [::]:8080;

    # 服务器名称
    server_name _;

    # 字符集
    charset utf-8;

    # 日志配置
    access_log /var/log/nginx/qingping-access.log;
    error_log /var/log/nginx/qingping-error.log;

    # 文件上传大小限制 50MB
    client_max_body_size 50M;

    # 请求体缓冲区
    client_body_buffer_size 128k;
    client_max_body_size 50M;

    # ============================================
    # 静态文件服务 - 前端构建产物
    # ============================================
    location / {
        root /opt/qingping-mvp/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # gzip 压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1k;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # HTML 文件不缓存
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # ============================================
    # API 反向代理 - 后端服务
    # ============================================
    location /api/ {
        # 后端服务地址
        proxy_pass http://127.0.0.1:8081;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲区设置
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # HTTP 版本
        proxy_http_version 1.1;
    }

    # ============================================
    # WebSocket / SSE 支持
    # ============================================
    location /api/tech-experts/stream {
        # 后端服务地址
        proxy_pass http://127.0.0.1:8081;

        # SSE 专用配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用代理缓冲（SSE 必须）
        proxy_buffering off;
        proxy_cache off;

        # SSE 相关 header
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # 长超时时间（SSE 长连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 立即发送数据
        proxy_flush_interval 0;
    }

    # WebSocket 通用支持
    location ~* /ws/ {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # ============================================
    # 上传文件访问（可选）
    # ============================================
    location /uploads/ {
        alias /opt/qingping-mvp/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # 禁止直接访问敏感文件
        location ~* \.(php|jsp|asp|sh|py|pl|rb)$ {
            deny all;
            return 404;
        }
    }

    # ============================================
    # 安全相关
    # ============================================

    # 隐藏 nginx 版本号
    server_tokens off;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }

    # 禁止访问特定文件
    location ~* \.(env|log|sql|bak|conf|config)$ {
        deny all;
        return 404;
    }
}
